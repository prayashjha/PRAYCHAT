<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>PrayChat - Connect with Faith</title>
    <meta name="title" content="PrayChat - Connect with Faith" />
    <meta name="description" content="Secure messaging app. Send messages, share status, make calls. Install on your phone!" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrayChat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PrayChat" />
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="mask-icon" href="/icons/icon.svg" color="#6366f1" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      html, body, #root { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        -webkit-text-size-adjust: 100%;
      }
      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.dark { background: #0b1120; color-scheme: dark; }
      html.light { background: #f8fafc; color-scheme: light; }
      
      /* Splash screen */
      .splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0b1120 0%, #1e1b4b 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 120px;
        height: 120px;
        animation: pulse 2s ease-in-out infinite;
      }
      .splash-text {
        margin-top: 24px;
        font-size: 32px;
        font-weight: 800;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .splash-tagline {
        margin-top: 8px;
        font-size: 14px;
        color: #94a3b8;
        letter-spacing: 0.5px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash" class="splash-screen">
      <img src="/icons/icon.svg" alt="PrayChat" class="splash-logo" />
      <div class="splash-text">PrayChat</div>
      <div class="splash-tagline">Connect with Faith</div>
    </div>
    
    <!-- App Root -->
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // Hide splash screen when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.classList.add('hidden');
          setTimeout(() => splash?.remove(), 300);
        }, 800);
      });
      
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PrayChat] Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.log('[PrayChat] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>

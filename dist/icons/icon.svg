<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="400" cy="120" r="80" fill="#ffffff" opacity="0.08"/>
  <circle cx="100" cy="400" r="100" fill="#ffffff" opacity="0.06"/>
  <!-- Shield shape -->
  <g filter="url(#shadow)">
    <path d="M256 100 L380 150 L380 270 C380 340 325 400 256 420 C187 400 132 340 132 270 L132 150 Z"
          fill="url(#shield)" opacity="0.98"/>
  </g>
  <!-- Chat bubble inside shield -->
  <path d="M200 210 Q200 190 220 190 L292 190 Q312 190 312 210 L312 260 Q312 280 292 280 L240 280 L218 300 L222 280 L220 280 Q200 280 200 260 Z"
        fill="#6366f1" opacity="0.95"/>
  <!-- Check mark -->
  <path d="M228 238 L248 258 L288 218"
        stroke="#ffffff" stroke-width="12" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small dots decoration -->
  <circle cx="230" cy="340" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="256" cy="350" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="282" cy="340" r="6" fill="#ffffff" opacity="0.6"/>
</svg>
